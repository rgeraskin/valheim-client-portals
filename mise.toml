[tools]
dotnet = "10"

[env]
# the game's Managed/ and BepInEx/core the build compiles against. Default: a copy of the Windows install kept in .deps/ (tools/fetch-local-deps.sh); point it at a Valheim folder to build against that instead
VALHEIM_DIR = "{{config_root}}/.deps"

[tasks.build]
description = "Build the plugin"
run = "dotnet build ClientPortals/ClientPortals.csproj -c Release"

[tasks.test]
description = "Unit tests (atlas merge/serialization, destination list, navigation)"
run = "dotnet test ClientPortals.Tests/ClientPortals.Tests.csproj -c Release"

[tasks.package]
description = "Make the Thunderstore zip in dist/"
depends = ["build"]
run = "tools/package.sh"
